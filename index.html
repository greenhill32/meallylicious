<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Archive - Ingest</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f7f8fb;
      --card: #ffffff;
      --text: #1f2937;
      --accent: #2563eb;
      --muted: #6b7280;
      --border: #d1d5db;
      --success-bg: #d1fae5;
      --success-text: #065f46;
      --success-border: #6ee7b7;
      --error-bg: #fee2e2;
      --error-text: #991b1b;
      --error-border: #fca5a5;
      --disabled: #9ca3af;
    }
    [data-theme="dark"] {
      --bg: #0e1420;
      --card: #1f2937;
      --text: #e2e8f0;
      --accent: #0ea5e9;
      --muted: #94a3b8;
      --border: #475569;
      --success-bg: #064e3b;
      --success-text: #86efac;
      --success-border: #22c55e;
      --error-bg: #7f1d1d;
      --error-text: #fca5a5;
      --error-border: #ef4444;
      --disabled: #6b7280;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      padding: 20px;
      color: var(--text);
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    .header h1 {
      font-size: 24px;
      color: var(--text);
    }
    .theme-toggle {
      padding: 8px 16px;
      border-radius: 6px;
      background: var(--accent);
      color: white;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .theme-toggle:hover { opacity: 0.9; }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: background-color 0.3s ease;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 24px;
      color: var(--text);
    }
    label {
      display: block;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
      margin-top: 16px;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      transition: border-color 0.2s, background-color 0.2s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    textarea {
      font-family: monospace;
      resize: vertical;
      min-height: 200px;
    }
    button {
      margin-top: 20px;
      padding: 12px 24px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled {
      background: var(--disabled);
      cursor: not-allowed;
      opacity: 1;
    }
    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      display: none;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }
    .status.success {
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
    }
    .status.error {
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid var(--error-border);
    }
    .status.show { display: block; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Archive Conversation</h1>
    <button class="theme-toggle" onclick="setTheme(getTheme() === 'dark' ? 'light' : 'dark')">
      <span id="themeLabel">🌙</span>
    </button>
  </div>
  
  <div class="container">
    <form id="ingestForm">
      <label>Title</label>
      <input type="text" id="title" required placeholder="Brief description MD">
      
      <label>Tags (comma-separated)</label>
      <input type="text" id="tags" required placeholder="sqlite,test,archive">
      
      <label>Date</label>
      <input type="date" id="date" required>
      
      <label>Source</label>
      <input type="text" id="source" required value="chatgpt" placeholder="chatgpt, claude, gemini">
      
      <label>Conversation Content</label>
      <textarea id="content" required placeholder="Paste full conversation here (with metadata if present)"></textarea>
      
      <button type="submit" id="submitBtn">Archive Conversation</button>
    </form>
    
    <div id="status" class="status"></div>
  </div>

  <script>
    // THEME TOGGLE
    function getTheme() {
      return localStorage.getItem('theme') || 'light';
    }
    
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      document.getElementById('themeLabel').textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    
    // Initialize theme on load
    (function() {
      setTheme(getTheme());
    })();

    const CONFIG = {
      supabase: {
        url: 'https://vkhdclatcbszacdhmvhb.supabase.co',
        key: 'sb_publishable_AgyxOAz7AUdQ82pgDGhKCg_yEvtHlVy'
      },
      azure: {
        endpoint: 'https://publicbucket3222.blob.core.windows.net/chatarchive',
        sas: 'sp=rw&st=2025-12-14T15:02:46Z&se=2027-12-14T23:17:46Z&spr=https&sv=2024-11-04&sr=c&sig=vhQr7OqNhE62tWyyQoj%2BeKsEN4CIVLZKzIeu9VPjzzU%3D'
      }
    };

    const contentField = document.getElementById('content');
    
    // Auto-fill form from pasted metadata
    contentField.addEventListener('input', function() {
      const text = contentField.value;
      const metadata = parseMetadata(text);
      
      if (metadata.CHAT_TITLE) document.getElementById('title').value = metadata.CHAT_TITLE;
      if (metadata.CHAT_TAGS) document.getElementById('tags').value = metadata.CHAT_TAGS;
      if (metadata.CHAT_DATE) document.getElementById('date').value = metadata.CHAT_DATE;
      if (metadata.CHAT_SOURCE) document.getElementById('source').value = metadata.CHAT_SOURCE;
    });

    function parseMetadata(text) {
      const metadata = {};
      
      // Try fenced format first (--- ... ---)
      const fencedMatch = text.match(/^---\s*\n([\s\S]*?)\n---/m);
      if (fencedMatch) {
        fencedMatch[1].split('\n').forEach(line => {
          const match = line.match(/^([A-Z_]+):\s*(.+)$/);
          if (match) metadata[match[1]] = match[2].trim();
        });
        return metadata;
      }
      
      // Try line-by-line format (CHAT_DATE: ...)
      const patterns = {
        CHAT_DATE: /CHAT_DATE:\s*([^\n\r]+?)(?=\s*(?:CHAT_|$))/,
        CHAT_TAGS: /CHAT_TAGS:\s*([^\n\r]+?)(?=\s*(?:CHAT_|$))/,
        CHAT_SOURCE: /CHAT_SOURCE:\s*([^\n\r]+?)(?=\s*(?:CHAT_|$))/,
        CHAT_TITLE: /CHAT_TITLE:\s*([^\n\r]+?)(?=\s*(?:CHAT_|$))/
      };
      
      for (const [key, pattern] of Object.entries(patterns)) {
        const match = text.match(pattern);
        if (match) metadata[key] = match[1].trim();
      }
      
      return metadata;
    }

    function generateFilename(title, date) {
      const slug = title.toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-|-$/g, '')
        .substring(0, 50);
      const shortId = Date.now().toString(36);
      return `${date}_${slug}_${shortId}.md`;
    }

    function createMarkdownContent(title, tags, date, source, content) {
      const tagsFormatted = tags.map(t => `\`${t}\``).join(', ');
      const archivedDate = new Date().toLocaleString('en-GB', { 
        dateStyle: 'full', 
        timeStyle: 'short' 
      });
      
      return `---
title: ${title}
tags: [${tags.join(', ')}]
date: ${date}
source: ${source}
archived: ${new Date().toISOString()}
---

# ${title}

**Tags:** ${tagsFormatted}  
**Date:** ${date}  
**Source:** ${source}  
**Archived:** ${archivedDate}

---

## Conversation

${content}

---

*Archived via Chat Archive System*`;
    }

    async function uploadBlob(filename, content) {
      const url = `${CONFIG.azure.endpoint}/${filename}?${CONFIG.azure.sas}`;
      const response = await fetch(url, {
        method: 'PUT',
        headers: {
          'x-ms-blob-type': 'BlockBlob',
          'Content-Type': 'text/markdown; charset=utf-8'
        },
        body: content
      });
      
      if (!response.ok) {
        throw new Error(`Azure upload failed: ${response.status}`);
      }
      
      return `${CONFIG.azure.endpoint}/${filename}`;
    }

    async function insertSupabase(data) {
      const response = await fetch(`${CONFIG.supabase.url}/rest/v1/conversations`, {
        method: 'POST',
        headers: {
          'apikey': CONFIG.supabase.key,
          'Authorization': `Bearer ${CONFIG.supabase.key}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(data)
      });
      
      if (!response.ok) {
        const error = await response.text();
        throw new Error(`Supabase insert failed: ${error}`);
      }
    }

    function showStatus(message, isError = false) {
      const status = document.getElementById('status');
      status.textContent = message;
      status.className = `status show ${isError ? 'error' : 'success'}`;
    }

    document.getElementById('ingestForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Archiving...';
      
      try {
        const title = document.getElementById('title').value;
        const tags = document.getElementById('tags').value.split(',').map(t => t.trim());
        const date = document.getElementById('date').value;
        const source = document.getElementById('source').value;
        const content = document.getElementById('content').value;
        
        // Generate filename
        const filename = generateFilename(title, date);
        
        // Create blob content
        const blobContent = createMarkdownContent(title, tags, date, source, content);
        
        // Upload to Azure
        showStatus('Uploading to Azure Blob Storage...');
        const blobUrl = await uploadBlob(filename, blobContent);
        
        // Insert into Supabase
        showStatus('Saving metadata to Supabase...');
        await insertSupabase({
          title,
          tags,
          chat_date: date,
          source,
          blob_url: blobUrl,
          blob_filename: filename
        });
        
        showStatus(`Archived: ${title}`);
        
        // Reset form
        setTimeout(() => {
          document.getElementById('ingestForm').reset();
          document.getElementById('date').valueAsDate = new Date();
          document.getElementById('source').value = 'chatgpt';
        }, 2000);
        
      } catch (error) {
        showStatus(`Error: ${error.message}`, true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Archive Conversation';
      }
    });
    
    // Set today's date by default
    document.getElementById('date').valueAsDate = new Date();
  </script>
</body>
</html>
